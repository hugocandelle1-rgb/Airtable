; =============================================================================
;  Contrôleur de la table à coussin d'air
;    pio run -e esp32s3            compile le firmware ESP32-S3-DevKitC-1
;    pio run -e esp32s3 -t upload  flashe (câble sur le port USB natif « USB »)
;    pio test -e native            tests unitaires de la logique pure (Unity, sur PC)
;    make -C firmware test         équivalent sans PlatformIO (g++ seul)
; =============================================================================
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
    -Wall -Wextra -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -DUSE_ADXL355             ; décommenter pour l'option inclinomètre ADXL355
build_unflags = -std=gnu++11
lib_deps =
    teemuatlut/TMCStepper@^0.7.3
    adafruit/Adafruit BME280 Library@^2.2.4
test_ignore = *               ; les tests tournent uniquement dans l'env native

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall -Wextra -Wno-unused-parameter
build_src_filter = -<*>        ; la logique testée est dans lib/atcore, pas dans src/
