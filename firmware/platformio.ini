; =============================================================================
;  Contrôleur de la table à coussin d'air
;    pio run -e esp32s3            compile le firmware ESP32-S3-DevKitC-1
;    pio run -e esp32s3 -t upload  flashe (câble sur le port USB natif « USB »)
;    pio run -e esp32s3_scl3300    option de compilation : SCL3300-D01 (1 capteur) à la place des 4 ADXL355
;    pio run -e esp32s3_flip       ADXL355 ×4 + retournement 180° motorisé (servo + index, -DUSE_FLIP_ACTUATOR)
;    pio test -e native            tests unitaires de la logique pure (Unity, sur PC)
;    make -C firmware test         équivalent sans PlatformIO (g++ seul)
; =============================================================================
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
    -Wall -Wextra -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Inclinomètres : ADXL355 ×4 par défaut ; env esp32s3_scl3300 = option SCL3300-D01 (1 capteur)
build_unflags = -std=gnu++11
lib_deps =
    teemuatlut/TMCStepper@^0.7.3
    adafruit/Adafruit BME280 Library@^2.2.4
test_ignore = *               ; les tests tournent uniquement dans l'env native

; Variante : inclinomètre SCL3300-D01 unique (pas de réseau, pas de fusion)
[env:esp32s3_scl3300]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DUSE_SCL3300

; Variante : retournement 180° motorisé de l'embase du capteur 0 (servo GPIO 37 + contact d'index GPIO 3)
[env:esp32s3_flip]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DUSE_FLIP_ACTUATOR

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall -Wextra -Wno-unused-parameter
build_src_filter = -<*>        ; la logique testée est dans lib/atcore, pas dans src/
