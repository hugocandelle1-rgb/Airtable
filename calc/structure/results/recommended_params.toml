# =============================================================================
#  STRUCTURE — VALEURS RECOMMANDÉES (générées par calc/structure/run_all.py)
#  Ne remplace pas params/design.toml : à fusionner par le coordinateur.
#  Notes : docs/03_structure_plaque.md, docs/04_usinage_tolerances.md,
#          docs/05_nivellement.md
# =============================================================================

[meta]
status = "verified"                 # chaîne complète exécutée (run_all)
date = "2026-11-04"
source = "calc/structure/*.py (plate_fe vérifié Navier ; homogénéisation vérifiée cellule 2D/3D)"

[plate]
material = "EN AW-5083 coulée détensionnée (ACP 5080 / Formodal 030 / MIC-6)"
thickness_mm = 35.0                 # 30 mm : pression ≈ 4,5 µrad au pas 5,00 (90 % du budget), 6,8 au pas 2,94 ⇒ 35 mm
outer_square_mm = 520.0
counterbore_d_mm = 2.0              # Ø2 convient à tous les pas à e = 35 ; Ø1,5 seulement si e = 30 et pas 2,94
counterbore_depth_mm = 33.8         # = e − voile 1,20 (sommet du cône)
orifice_length_mm = 1.20            # voile retenu par le lot aéro
orifice_d_mm = 0.30                 # ±0,005 (lot aéro)
pitch_mm = 5.0                      # hex, retenu par le lot aéro ; autres pas : [plate.pitch_sensitivity]
D_ratio_perforated = 0.694         # e = 35, pas 5,00, Ø2, voile 1,2 (stratifié prudent)
E_ratio_perforated_layer = 0.662
mass_kg = 23.5                    # plaque percée 520×520×35
alpha_th = 24.2e-6
k_W_mK = 110.0                      # borne basse 110–140 (fiche ACP 5080R)

[plate.pitch_sensitivity]           # e = 35, chemin B, schéma retenu : D*/D ; pente pression crête (µrad) ; nb de trous
p2_94_cb1_5 = { D_ratio = 0.560, pressure_slope_urad = 2.43, n_holes = 17131, mass_kg = 22.4 }
p2_94_cb2_0 = { D_ratio = 0.364, pressure_slope_urad = 3.16, n_holes = 17131, mass_kg = 20.3 }
p4_23_cb1_5 = { D_ratio = 0.747, pressure_slope_urad = 1.99, n_holes = 8197, mass_kg = 23.8 }
p4_23_cb2_0 = { D_ratio = 0.606, pressure_slope_urad = 2.30, n_holes = 8197, mass_kg = 22.8 }
p4_82_cb1_5 = { D_ratio = 0.797, pressure_slope_urad = 1.90, n_holes = 6333, mass_kg = 24.1 }
p4_82_cb2_0 = { D_ratio = 0.676, pressure_slope_urad = 2.14, n_holes = 6333, mass_kg = 23.4 }
p5_0_cb1_5 = { D_ratio = 0.809, pressure_slope_urad = 1.88, n_holes = 5935, mass_kg = 24.2 }
p5_0_cb2_0 = { D_ratio = 0.694, pressure_slope_urad = 2.10, n_holes = 5935, mass_kg = 23.5 }

[support]
scheme = "3pt-kelvin-frame"         # 3 appuis cinématiques (Maxwell 3 vés) sur le cadre supérieur, hors plenum
pressure_path = "B"                 # caisson de plenum suspendu à la plaque (poussée auto-équilibrée)
points_mm = [[0.0, 237.5], [237.5, -142.5], [-237.5, -142.5]]   # repère : centre plaque, +y = arrière
fixed_point = 0                     # appui arrière fixe ; appuis 1 et 2 (côtés) motorisés
reactions_N = [130.5, 108.8, 108.8]       # poids propre (plaque + caisson + accessoires)
slope_deadweight_urad = 14.4       # sans finition sur appuis (hors budget 10)
slope_deadweight_finished_on_supports_urad = 1.7
slope_pressure_urad = 2.04          # 0 → 400 Pa (budget 5)
friction_mu = 0.15
slope_friction_worst_urad = 1.64
finishing_on_service_supports = true   # finition avec lest du caisson (±5 %) ; caisson absent : 3.0 µrad
radius_ratio = 0.0                  # sans objet (positions explicites ci-dessus)

[support.coupling]
ball_d_mm = 25.4                   # bille G10 100Cr6 collée dans un logement H8 de la plaque, centre 2 mm sous la face
roller_d_mm = 20                   # 2 rouleaux trempés rectifiés h6 par vé, vé à 90°
vee_axis_angle_deg = [-90.0, 151.9, 28.1]   # axes des vés vers le barycentre
preload_N = 0                     # aucune : poids seul + butées anti-soulèvement (jeu 0,5 mm)
hertz_pmax_GPa = 1.54
k_support_N_per_um = 31

[leveling]
mechanism = "vérin à coin 1:5 sur cage à aiguilles, tête guidée par lames flexibles"
wedge_tan = 0.2
screw = "M6×0,25 (écrou bronze rattrapé par ressort), irréversible"
motor = "NEMA17 200 pas/tr, double arbre (bouton gradué 100 div côté manuel), TMC2209"
resolution_urad_per_full_step = 0.66
resolution_urad_per_knob_div = 1.32
vertical_range_pm_mm = 2.38
wedge_travel_pm_mm = 11.9
screw_force_N = 22
screw_torque_mNm = 12.5
lever_pitch_mm = 380
lever_roll_mm = 475
coarse = "4 pieds M16×2 sous le bâti (≈ 4 mrad/tour)"

[leveling.economique]               # variante économique NON APPLICABLE (compensation exclue) ; gardé pour mémoire
mechanism = "même coin 1:5 entraîné par ajusteur différentiel du commerce (type Thorlabs DAS110)"
resolution_urad_per_rev_fine = 13.2
resolution_urad_per_div = 0.26
coarse_urad_per_rev = 167
screw_force_N = 33     # charge de l'ajusteur à confirmer sur fiche

[tilt_sensors]
type = "ADXL355 ×4 sur embases isothermes rotatives indexées (retournement 180°)"
positions_mm = [[-220.0, 220.0], [220.0, 220.0], [-220.0, -220.0], [220.0, -220.0]]   # face supérieure, bande pleine
note = "moyenne des 4 = inclinaison du plan (le dôme de pression s'annule par symétrie)"
base_block_mm = [60.0, 60.0, 20.0]
base_feet_height_mm = 12.0
base_feet_spacing_mm = 40.0
slope_base_gradient_urad = 0.34      # pour 50 mK de gradient latéral
offset_residual_typ_urad = 1.0

[thermal]
air_minus_plate_max_K = 1.0         # pente transitoire 1.4 µrad/K (Qmax)
dT_through_max_mK = 34            # gradient haut/bas admissible (e = 35)
settle_time_min = 50             # après changement de débit (Qmin, pire)
fan_air_heating_K_max = 1.08

[plenum]
inner_square_mm = 430.0             # caisson suspendu (chemin B) ; design.toml : 440
wall_mm = 6.0
bottom_mm = 6.0
box_mass_kg = 10.1
attachment_line_half_mm = 218.0     # axe des parois sur la face inférieure de la plaque

[frame]
profile_system = "Bosch Rexroth rainure 10 (45×90 cadre supérieur et montants, 45×45 ceintures et écharpes)"
profile_main_mm = 45
top_ring_axis_half_mm = 250.0       # cadre 545×545 hors tout, 45×90 posé de chant
ring_axis_height_mm = 745.0         # dessus du cadre 790, dessus de plaque 900 mm
bracing = "écharpes 45×45 sur 3 faces (arrière, gauche, droite)"
f1_Hz = 49                     # assemblages semi-rigides ; sans écharpes : 26 Hz
mass_profiles_kg = 31.1
economique = "NON APPLICABLE — pour mémoire : paillasse, cadre 45×45, montants 300 mm, écharpes 3 faces"
economique_f1_Hz = 86           # bâti seul ; la table support domine

[machining]
finish_reference = "surfaçage diamant mono-pointe sur appuis de service (lest du caisson), ou rodage + carte"
flatness_perforated_um_required = 2.8   # pour 30 µrad (85 % forme)
flatness_100_um_required = 0.53
cdc_6um_gives_urad = 56             # incohérence du CdC à arbitrer
finish_economique = "NON APPLICABLE (supposait une compensation logicielle, exclue le 2026-11-03)"
economique_slope_urad = [205, 251]   # 15 / 20 µm, avant compensation
drilling_hours_5935_holes = 20
drilling_hours_17131_holes = 51

[budget]
reference_rss_urad = 30.6   # ancien budget (structure seule, sans crantage ni balourd) ; voir [parasitic_budget]
economique_rss_urad_non_applicable = 251
economique_after_compensation_urad_non_applicable = 11

[parasitic_budget]                  # table de caractérisation : force parasite dans le plan = erreur de mesure
criterion = "somme quadratique des pentes équivalentes ≤ θ = a_par/g (aucune compensation des palets)"
min_theta_urad = 10.1             # tous postes au plancher, crantage corrigé a posteriori
min_theta_without_cogging_correction_urad = 33.7
current_design_rss_urad = 47.0   # conception actuelle, crantage brut compris
level_5urad = { feasible = false }
level_10urad = { feasible = false }
level_20urad = { feasible = true, cogging_correction = true, a_par_um_s2 = 196, flatness_um = 1.1, flatness_100_um = 0.21, puck_unbalance_um = 7.7, orifice_tol_um = 4.5, air_speed_mm_s = 20, air_minus_plate_K = 0.71, room_ramp_K_h = 2.25, recal_interval_h = 1.0, cost_index = 9.3 }
level_30urad = { feasible = true, cogging_correction = true, a_par_um_s2 = 294, flatness_um = 1.6, flatness_100_um = 0.31, puck_unbalance_um = 11.7, orifice_tol_um = 6.8, air_speed_mm_s = 25, air_minus_plate_K = 0.71, room_ramp_K_h = 2.25, recal_interval_h = 1.0, cost_index = 3.3 }
level_50urad = { feasible = true, cogging_correction = false, a_par_um_s2 = 490, flatness_um = 2.8, flatness_100_um = 0.54, puck_unbalance_um = 10.0, orifice_tol_um = 5.0, air_speed_mm_s = 17, air_minus_plate_K = 0.71, room_ramp_K_h = 2.25, recal_interval_h = 1.0, cost_index = 1.3 }
